# Un espacio de trabajo por proyecto; no se inicia automáticamente.
set -g default-shell /bin/zsh
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB'
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard external

# Ctrl-a seguido de una tecla. Ctrl-a Ctrl-a envía Ctrl-a al programa.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message 'Configuración recargada'
# Fondo Mellifluous: evita el gris predeterminado de las ventanas emergentes.
set -g popup-style 'bg=#1a1a1a,fg=#dadada'
set -g popup-border-style 'bg=#1a1a1a,fg=#5b5b5b'
bind g display-popup -d '#{pane_current_path}' -w 95% -h 90% -E lazygit

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

set -g status-position top
set -g status-style 'bg=default,fg=#dadada'
set -g status-left-length 45
set -g status-left '#[fg=cyan]#h #[fg=yellow]#S '
set -g status-right '#[fg=brightblack]%H:%M'
setw -g window-status-current-style 'fg=yellow,bold'
set -g pane-active-border-style 'fg=yellow'
