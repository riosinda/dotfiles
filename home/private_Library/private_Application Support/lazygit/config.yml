# Integración simple de Lazygit + delta, como en el PR #3 de Milton.
# No incluye generación de commits con IA ni clientes de API.
gui:
  colorScheme: dark
  theme:
    activeBorderColor: ['#c0af8c', bold]
    inactiveBorderColor: ['#5b5b5b']
    selectedLineBgColor: ['#2d2d2d']
    inactiveViewSelectedLineBgColor: ['#1a1a1a']
    selectedLineFgColor: ['#dadada', bold]
    optionsTextColor: ['#a8a1be']
    defaultFgColor: ['#dadada']
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
