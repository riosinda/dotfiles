"$schema" = 'https://starship.rs/config-schema.json'

# Distribución Tokyo Night con tonos oscuros, verde claro y blanco/lila.
format = """
[░▒▓](#2d2d2d)\
$os\
[](bg:#101010 fg:#2d2d2d)\
$directory\
[](fg:#101010 bg:#181818)\
$git_branch\
$git_status\
[](fg:#181818 bg:#101010)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#101010 bg:#202020)\
$time\
[ ](fg:#202020)\
\n$character"""

[directory]
style = "fg:#e4e1f5 bg:#101010"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#181818"
format = '[[ $symbol $branch ](fg:#c3e88d bg:#181818)]($style)'

[git_status]
style = "bg:#181818"
format = '[[($all_status$ahead_behind )](fg:#c3e88d bg:#181818)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#181818"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#c3e88d bg:#181818)]($style)'

[jj_status]
style = "bg:#181818"
format = '[[($all )](fg:#c3e88d bg:#181818)]($style)'

[nodejs]
symbol = ""
style = "bg:#101010"
format = '[[ $symbol ($version) ](fg:#c3e88d bg:#101010)]($style)'

[bun]
symbol = ""
style = "bg:#101010"
format = '[[ $symbol ($version) ](fg:#c3e88d bg:#101010)]($style)'

[rust]
symbol = ""
style = "bg:#101010"
format = '[[ $symbol ($version) ](fg:#c3e88d bg:#101010)]($style)'

[golang]
symbol = ""
style = "bg:#101010"
format = '[[ $symbol ($version) ](fg:#c3e88d bg:#101010)]($style)'

[php]
symbol = ""
style = "bg:#101010"
format = '[[ $symbol ($version) ](fg:#c3e88d bg:#101010)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#202020"
format = '[[  $time ](fg:#a6a6a6 bg:#202020)]($style)'

[os]
style = "bg:#2d2d2d fg:#c3e88d"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
success_symbol = "[❯](bold #c3e88d)"
error_symbol = "[❯](bold #e78284)"
