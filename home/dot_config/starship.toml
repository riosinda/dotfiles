"$schema" = "https://starship.rs/config-schema.json"
# Bloques separados, inspirados en Warp. Usa Menlo sin iconos de Nerd Font.
format = "$hostname$nodejs$python$conda$directory$cmd_duration\n($git_branch$git_commit$git_state$git_status\n)$character"
add_newline = true
palette = "inda"

[palettes.inda]
block = "#101010"
green = "#c3e88d"
text = "#e4e1f5"
muted = "#a6a6a6"
yellow = "#e5c890"
red = "#e78284"

[hostname]
ssh_only = true
format = "[ ssh:$hostname ](bold fg:yellow bg:block) "

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
style = "bold fg:text bg:block"
format = "[ $path($read_only) ]($style) "
read_only = " ro"
read_only_style = "fg:yellow bg:block"

[git_branch]
symbol = "git:"
format = "[ $symbol$branch ]($style) "
style = "bold fg:green bg:block"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
format = "[ @$hash ](bold fg:green bg:block) "
only_detached = true

[git_state]
format = '[ $state( $progress_current/$progress_total) ](bold fg:yellow bg:block) '

[git_status]
style = "fg:green bg:block"
format = '([ $all_status$ahead_behind ]($style) )'
modified = 'mod:$count '
staged = '+$count '
untracked = '?$count '
deleted = '-$count '
renamed = 'ren:$count '
conflicted = 'conflict:$count '
stashed = 'stash:$count '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑${ahead_count} ↓${behind_count} '

[nodejs]
symbol = "Node "
format = '[ $symbol$version ]($style) '
style = "bold fg:green bg:block"

[python]
symbol = "Py "
format = '[ $symbol${version}( $virtualenv) ]($style) '
style = "bold fg:green bg:block"

[conda]
symbol = "Conda "
ignore_base = false
format = "[ $symbol$environment ]($style) "
style = "bold fg:green bg:block"

[cmd_duration]
min_time = 2000
format = "[ $duration ](fg:muted bg:block) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
